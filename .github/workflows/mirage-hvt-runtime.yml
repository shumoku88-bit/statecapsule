name: MirageOS hvt runtime

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hvt-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.1"

      - name: Boot hvt and exercise HTTP
        run: bash tools/check-mirage-hvt-runtime
