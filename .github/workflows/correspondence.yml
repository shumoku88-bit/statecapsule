name: Correspondence

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  transition-relation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test

      - name: Compare explored transitions
        run: bash tools/check-correspondence
