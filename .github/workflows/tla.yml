name: TLA+

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Model-check StateCapsule
        run: bash tools/check-tla
